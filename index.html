<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Undertale Dialogue</title>

<style>
    @font-face {
        font-family: "Determination Mono";
        src: url("https://cartr.gitlab.io/undertale-fonts/webfonts/determinationmonoweb-webfont.woff2")
             format("woff2");
        font-weight: normal;
        font-style: normal;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #111;
    }

    .dialogue-box {
        
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);

        width: min(90vw, 1200px);
        aspect-ratio: 578 / 152;
        container-type: inline-size;

        border: 6px solid white;
        background: black;
        color: white;

        display: flex;
        align-items: flex-start;
        padding: min(3vw, 40px);
        gap: min(3vw, 40px);
        
        font-family: "Determination Mono", monospace;
    }

    .asterisk,
    #text {
        font-size: clamp(16px, 5.54cqw, 67px);
        line-height: 1.25;
    }

    .asterisk {
        flex-shrink: 0;
    }

    #text {
        min-width: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }
    .dialogue-box {
    visibility: hidden;
}
    #text {
    width: 100%;
    white-space: normal;
}

.dialogue-line {
    display: flex;
    gap: 0.6em;
    align-items: flex-start;
}

.dialogue-line::before {
    content: "*";
    flex-shrink: 0;
}

.line-content {
    min-width: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
.portrait {
    width: 16%;
    height: auto;
    flex-shrink: 0;
    align-self: flex-start;
    image-rendering: pixelated;
}

#text {
    flex: 1;
    width: auto;
    min-width: 0;
}
</style>
</head>

<body>
    <div class="dialogue-box">
        <img class="portrait" src="flowey.png" alt="Flowey">
        <div id="text"></div>
    </div>
    
    
    <script>
        const messages = ["Howdy\nI'm FLOWEY.\nFLOWEY the FLOWER","Hmmm...","You're new to the UNDERGROUND, aren'tcha", "Golly, you must be so confused.","Someone ought to teach you how things work around here!", "I guess little old me will have to do.", "Ready?\nHere we go!"];
        const typingSpeed = 55;
        const text = document.getElementById("text");
        const box = document.querySelector(".dialogue-box");
        let index = 0;
        let line = 0;
        let delay = 30; 
        let timer;
        let ready = false;
        let done = false;
        function renderText(value) {
            text.replaceChildren();

            value.split("\n").forEach(function (part) {
                const row = document.createElement("div");
                row.className = "dialogue-line";

                const content = document.createElement("span");
                content.className = "line-content";
                content.textContent = part;

                row.appendChild(content);
                text.appendChild(row);
            });
        }

        function typeLetter() {
            
            if (index < messages[line].length) {
                index++;
                renderText(messages[line].slice(0, index));
                timer = setTimeout(typeLetter, typingSpeed);
            }
            else {
                console.log("done")
                done = true;
            }
        }
        function startDialogue() {
            clearTimeout(timer);
            index = 0;
            renderText("");
            typeLetter();
        }

       box.addEventListener("click", function () {
            if (!ready) return;

            if (index < messages[line].length) {
                clearTimeout(timer);
                renderText(messages[line]); 
                done = true;
                index = messages[line].length;
            } else {
                startDialogue();
            }
        });
        function runText(){
            done = false;
            
            const wait = new Promise(resolve => setTimeout(resolve, delay));
            const fontLoaded = document.fonts
            .load('32px "Determination Mono"')
            .catch(console.error);

            Promise.all([wait, fontLoaded]).then(function () {
                box.style.visibility = "visible";
                ready = true;
                startDialogue();
            });}
        window.addEventListener('load', () => {
            runText()
        });
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                delay = 0;
                if (done == true){
                if (line == messages.length - 1) {
                    line = 0;
                }
                else {
                    line = line + 1;
                }
                
                runText()
                console.log("next")
                console.log(line)
                }
            }
        });
    </script>
</body>
</html>
