    <div class="dialogue-box">
        <img class="portrait" src="flowey.png" alt="Flowey">
        <div id="text"></div>
    </div>
    
    
    <script>

        const messages = ["Howdy\nI'm FLOWEY.\nFLOWEY the FLOWER","Hmmm...","You're new to the UNDERGROUND, aren'tcha", "Golly, you must be so confused.","Someone ought to teach you how things work around here!", "I guess little old me will have to do.", "Ready?\nHere we go!"];
        const typingSpeed = 55;
        const text = document.getElementById("text");
        const box = document.querySelector(".dialogue-box");
        let index = 0;
        let line = 0;
        let delay = 10000; 
        let timer;
        let ready = false;
        let done = false;
        window.addEventListener("click", function () {
        const source = document.querySelector("#soundSource");

            if (source && source.components.sound) {
                    source.components.sound.playSound();
            }
        }, { once: true });
            function renderText(value) {
                text.replaceChildren();

            value.split("\n").forEach(function (part) {
                const row = document.createElement("div");
                row.className = "dialogue-line";

                const content = document.createElement("span");
                content.className = "line-content";
                content.textContent = part;

                row.appendChild(content);
                text.appendChild(row);
            });
        }

        function typeLetter() {
            
            if (index < messages[line].length) {
                index++;
                renderText(messages[line].slice(0, index));
                timer = setTimeout(typeLetter, typingSpeed);
            }
            else {
                console.log("done")
                done = true;
            }
        }
        function startDialogue() {
            clearTimeout(timer);
            index = 0;
            renderText("");
            typeLetter();
        }

       box.addEventListener("click", function () {
    document.addEventListener('keydown', function(event) {
            if (!ready) return;

            if (index < messages[line].length && event.key === 'Shift'||index < messages[line].length && event.key === 'x') {
                clearTimeout(timer);
                renderText(messages[line]); 
                done = true;
                index = messages[line].length;
            } else {
               // startDialogue();
            }
        });});
        function runText(){
            done = false;
            
            const wait = new Promise(resolve => setTimeout(resolve, delay));
            const fontLoaded = document.fonts
            .load('32px "Determination Mono"')
            .catch(console.error);

            Promise.all([wait, fontLoaded]).then(function () {
                box.style.visibility = "visible";
                ready = true;
                startDialogue();
            });}
        window.addEventListener('load', () => {
            
            runText()
            
        });
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.key === 'z') {
                delay = 0;
                if (done == true){
                if (line == messages.length - 1) {
                    line = 0;
                }
                else {
                    line = line + 1;
                }
                
                runText()
                console.log("next")
                console.log(line)
                }
            }
        });
    </script>
