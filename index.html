        <style>
    @font-face {

    .dialogue-box {

        left: 50%;
        transform: translateX(-50%);

        container-type: inline-size;

        border: 6px solid white;

        color: white;

        padding: min(3vw, 40px);
        gap: min(3vw, 40px);
        
        font-family: "Determination Mono", monospace;
    }

    .asterisk,
    #text {
        font-size: clamp(16px, 5.54cqw, 67px);
        line-height: 1.25;
    }

    .asterisk {
        flex-shrink: 0;
    }

    #text {
        min-width: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }
    .dialogue-box {
    visibility: hidden;
}
    #text {
    width: 100%;
    white-space: normal;
}

.dialogue-line {
    display: flex;
    gap: 0.6em;
    align-items: flex-start;
}

.dialogue-line::before {
    content: "*";
    flex-shrink: 0;
}

.line-content {
    min-width: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
.portrait {
    width: 16%;
    height: auto;
    flex-shrink: 0;
    align-self: flex-start;
    image-rendering: pixelated;
}

#text {
    flex: 1;
    width: auto;
    min-width: 0;
}
</style>

    <body>
        <style>
             @font-face {

                 format("woff2");

        }

        * {

        }
                body {
            margin: 0;

            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .dialogue-box {

        }

        .asterisk {

        </style>
        <a-scene>
            <a-assets>

                <a-asset-item

                </a-asset-item>

            <a-entity

                <a-entity

            <!--https://docs.google.com/document/d/1S6Z4qRBESS6_yT4wYpnRu9BOk0egSdM2Abugt6LGooQ/edit?tab=t.0-->

            <a-box static-body id="ruinsWallBack-2" static-body="sphereRadius: NaN"   position="0 2506.65 -20" width="3.91" height="5000" depth="1" material="color: white;

            <a-box static-body id="ruinsWallBack-5" position="11.22943 5.31 -20" width="6.57" height="5000" depth="1" material="color: white;

    <div class="dialogue-box">
        <img class="portrait" src="flowey.png" alt="Flowey">
        <div id="text"></div>
    </div>
    
    
    <script>
        const bullet = document.querySelector(".bullet");
        const camera = document.querySelector("#camera");
        const messages = ["Howdy!\nI'm [y]FLOWEY[/y].\n[y]FLOWEY[/y] the [y]FLOWER[/y]!","Hmmm...","You're new to the UNDERGROUND, aren'tcha?", "Golly, you must be so confused.","Someone ought to teach you how things work around here!", "I guess little old me will have to do.", "Ready?\nHere we go!"];
        const typingSpeed = 55;
        const text = document.getElementById("text");
        const box = document.querySelector(".dialogue-box");
        let index = 0;
        let line = 0;
        let collisionReady = false;
        let delay = 10000; 
        let timer;
        let textReady = false;
        let done = false;
        window.addEventListener("click", function () {
        const source = document.querySelector("#soundSource");

            if (source && source.components.sound) {
                    source.components.sound.playSound();
            }
        }, { once: true });
        function renderText(value, limit = Infinity) {
            text.replaceChildren();

            let y = false;
            let count = 0;
            let content;

            function newRow() {
                const row = document.createElement("div");
                row.className = "dialogue-line";

                content = document.createElement("span");
                content.className = "line-content";

                row.appendChild(content);
                text.appendChild(row);
            }

            newRow();

            const parts = value.split(/(\[y\]|\[\/y\]|\n)/);

            for (const part of parts) {
                if (part === "[y]") {
                    y = true;
                } else if (part === "[/y]") {
                    y = false;
                } else if (part === "\n") {
                    if (count >= limit) break;
                    count++;
                    newRow();
                } else {
                    const remaining = Math.max(0, limit - count);
                    const visible = part.slice(0, remaining);

                    if (visible) {
                        const span = document.createElement("span");
                        span.style.color = y ? "#ffff00" : "#ffffff";
                        span.textContent = visible;
                        content.appendChild(span);
                        count += visible.length;
                    }

                    if (visible.length < part.length) break;
                }
            }
        }




        function typeLetter() {
            const message = messages[line];
            const plainText = message.replace(/\[\/?y\]/g, "");

            if (index < plainText.length) {
                index++;
                renderText(message, index);
            }

            if (index < plainText.length) {
                timer = setTimeout(typeLetter, typingSpeed);
            } else {
                done = true;
                console.log("donezo");
            }
        }
        function startDialogue() {
            clearTimeout(timer);
            index = 0;
            renderText("");
            typeLetter();
        }

       box.addEventListener("click", function () {
    document.addEventListener('keydown', function(event) {
            if (!textReady) return;

            if (index < messages[line].length && event.key === 'Shift'||index < messages[line].length && event.key === 'x') {
                clearTimeout(timer);
                renderText(messages[line]); 
                done = true;
                index = messages[line].length;
            } else {
               // startDialogue();
            }
        });});
        function runText(){
            done = false;
            
            const wait = new Promise(resolve => setTimeout(resolve, delay));
            const fontLoaded = document.fonts
            .load('32px "Determination Mono"')
            .catch(console.error);

            Promise.all([wait, fontLoaded]).then(function () {
                box.style.visibility = "visible";
                textReady = true;
                startDialogue();
            });}
        window.addEventListener('load', () => {
            collisionReady = true;
            runText()
            
        });
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.key === 'z') {
                delay = 0;
                if (done == true){
                if (line == messages.length - 1) {
                    line = 0;
                }
                else {
                    line = line + 1;
                }
                
                runText()
                console.log("next")
                console.log(line)
                }
            }
        });
        bullet.addEventListener("collide", function (event) {
            console.log("Hit");
        });
        camera.addEventListener("hit", function (event) {
            if (!collisionReady) return;

            const bullet = event.detail.el;
            if (!bullet) return;

            console.log("Touched this bullet:", bullet);

            bullet.setAttribute("color", "red");
        });

        camera.addEventListener("hitend", function (event) {
            console.log("Done:", event.detail.el);
        });
        function shoot(){

        }
    </script>
