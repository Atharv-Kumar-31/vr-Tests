<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>

    <title>update</title>

    <style>
        @font-face {
            font-family: "Determination Mono";
            src: url("https://cartr.gitlab.io/undertale-fonts/webfonts/determinationmonoweb-webfont.woff2")
                 format("woff2");
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
        }

        .dialogue-box {
            visibility: hidden;
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;

            width: min(90vw, 1200px);
            aspect-ratio: 578 / 152;
            container-type: inline-size;

            border: 6px solid white;
            background: black;
            color: white;

            display: flex;
            align-items: flex-start;
            padding: min(3vw, 40px);
            gap: min(3vw, 40px);

            font-family: "Determination Mono", monospace;
        }

        .portrait {
            width: 16%;
            height: auto;
            flex-shrink: 0;
            image-rendering: pixelated;
        }

        #text {
            flex: 1;
            min-width: 0;
            font-size: clamp(16px, 5.54cqw, 67px);
            line-height: 1.25;
        }

        .dialogue-line {
            display: flex;
            align-items: flex-start;
            gap: 0.6em;
        }

        .dialogue-line::before {
            content: "*";
            flex-shrink: 0;
        }

        .line-content {
            min-width: 0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <!-- Background music: starts after a click or keypress. -->
    <audio id="bestFriend" src="flowey.mp3" preload="auto" loop></audio>

    <a-scene>
        <a-assets>
            <a-asset-item
                id="flowey"
                src="https://atharv-kumar-31.github.io/floweymodel/flowey/scene.gltf">
            </a-asset-item>
        </a-assets>

        <a-sky color="black"></a-sky>

        <a-gltf-model
            src="#flowey"
            position="0 1 -20"
            scale="0.1 0.1 0.1"
            rotation="0 0 0"
            animation="property: rotation;
                       from: 0 0 0;
                       to: 0 180 0;
                       dur: 10000">
        </a-gltf-model>

        <a-plane
            color="green"
            position="0 0 0"
            rotation="-90 0 0"
            height="1000"
            width="1000">
        </a-plane>
    </a-scene>

    <div class="dialogue-box">
        <img class="portrait" src="flowey.png" alt="Flowey">
        <div id="text"></div>
    </div>

    <script>
        const messages = [
            "Howdy\nI'm FLOWEY.\nFLOWEY the FLOWER",
            "Hmmm...",
            "You're new to the UNDERGROUND, aren'tcha",
            "Golly, you must be so confused.",
            "Someone ought to teach you how things work around here!",
            "I guess little old me will have to do.",
            "Ready?\nHere we go!"
        ];

        const typingSpeed = 55;
        const delay = 10000;

        const text = document.getElementById("text");
        const box = document.querySelector(".dialogue-box");
        const music = document.getElementById("bestFriend");

        let index = 0;
        let line = 0;
        let timer;
        let ready = false;
        let done = false;
        let musicStarting = false;

        // MUSIC
        music.volume = 0.5;

        async function startMusic() {
            if (!music.paused || musicStarting) return;

            musicStarting = true;

            try {
                await music.play();
            } catch (error) {
                console.error("Music failed:", error);
            } finally {
                musicStarting = false;
            }
        }

        window.addEventListener("click", startMusic);
        window.addEventListener("keydown", startMusic);

        // DIALOGUE
        function renderText(value) {
            text.replaceChildren();

            value.split("\n").forEach(function (part) {
                const row = document.createElement("div");
                row.className = "dialogue-line";

                const content = document.createElement("span");
                content.className = "line-content";
                content.textContent = part;

                row.appendChild(content);
                text.appendChild(row);
            });
        }

        function typeLetter() {
            const message = messages[line];

            if (index < message.length) {
                index++;
                renderText(message.slice(0, index));
            }

            if (index < message.length) {
                timer = setTimeout(typeLetter, typingSpeed);
            } else {
                done = true;
            }
        }

        function startDialogue() {
            clearTimeout(timer);
            index = 0;
            done = false;
            renderText("");
            typeLetter();
        }

        function advanceDialogue() {
            if (!ready) return;

            if (!done) {
                clearTimeout(timer);
                index = messages[line].length;
                renderText(messages[line]);
                done = true;
            } else {
                line = (line + 1) % messages.length;
                startDialogue();
            }
        }

        box.addEventListener("click", advanceDialogue);

        document.addEventListener("keydown", function (event) {
            if (
                (event.key === "Enter" ||
                 event.key.toLowerCase() === "z") &&
                !event.repeat
            ) {
                event.preventDefault();
                advanceDialogue();
            }
        });

        // Delay only the first dialogue page.
        const wait = new Promise(function (resolve) {
            setTimeout(resolve, delay);
        });

        const fontLoaded = document.fonts
            .load('32px "Determination Mono"')
            .catch(console.error);

        Promise.all([wait, fontLoaded]).then(function () {
            box.style.visibility = "visible";
            ready = true;
            startDialogue();
        });
    </script>
</body>
</html>
